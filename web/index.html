<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FragPredict — CS2 harita tahmini</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1a7 7 0 0 0 0 14z' fill='%23f5a524'/><path d='M8 1a7 7 0 0 1 0 14z' fill='%234ea1ff'/></svg>">
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --line: #2a2f3a;
    --text: #e8eaef;
    --muted: #9aa2b1;
    --t1: #f5a524;
    --t2: #4ea1ff;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 40px 20px 60px; }
  header h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; }
  header h1 span { color: var(--t1); }
  header p { margin: 6px 0 28px; color: var(--muted); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; }
  .row { margin-top: 16px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: var(--muted); }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--t2); outline-offset: 1px; }
  #team1 { border-left: 3px solid var(--t1); }
  #team2 { border-left: 3px solid var(--t2); }
  button { font: inherit; cursor: pointer; border-radius: 8px; }
  #swap {
    height: 44px; width: 44px;
    border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    font-size: 1.1rem;
  }
  #swap:hover { color: var(--text); }
  #submit {
    width: 100%; margin-top: 20px; padding: 12px;
    border: 0; background: var(--t1); color: #111; font-weight: 600;
  }
  #submit:disabled { opacity: 0.5; cursor: wait; }
  .hint { margin: 8px 0 0; font-size: 0.8rem; color: var(--muted); }
  #error { margin: 12px 0 0; color: var(--err); }

  #result { margin-top: 20px; }
  .sides { display: flex; justify-content: space-between; gap: 16px; }
  .side { display: flex; flex-direction: column; min-width: 0; }
  .side:last-child { text-align: right; }
  .side .name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side .pct { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  #side1 .pct { color: var(--t1); }
  #side2 .pct { color: var(--t2); }
  .bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 10px 0 14px; background: var(--line); }
  .bar div { transition: width 0.4s ease; }
  #bar1 { background: var(--t1); }
  #bar2 { background: var(--t2); }
  #summary { margin: 0; }
  #context { margin: 4px 0 0; font-size: 0.85rem; color: var(--muted); }

  footer { margin-top: 28px; font-size: 0.8rem; color: var(--muted); }
  footer p { margin: 0 0 6px; }
  footer a { color: var(--muted); }

  @media (max-width: 560px) {
    .teams { grid-template-columns: 1fr; }
    #swap { justify-self: center; transform: rotate(90deg); }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Frag<span>Predict</span></h1>
    <p>Profesyonel CS2 maçlarında, seçtiğin haritayı hangi takımın kazanacağını tahmin eden bir makine öğrenmesi modeli.</p>
  </header>

  <form id="form" class="card" novalidate>
    <div class="teams">
      <label>Takım 1
        <input id="team1" list="team-list" autocomplete="off" placeholder="ör. Team Vitality" required>
      </label>
      <button type="button" id="swap" title="Takımları yer değiştir" aria-label="Takımları yer değiştir">⇄</button>
      <label>Takım 2
        <input id="team2" list="team-list" autocomplete="off" placeholder="ör. Natus Vincere" required>
      </label>
    </div>
    <div class="row">
      <label>Harita
        <select id="map" required></select>
      </label>
    </div>
    <p class="hint" id="pool-hint"></p>
    <button type="submit" id="submit" disabled>Yükleniyor…</button>
    <p id="error" role="alert" hidden></p>
  </form>

  <section id="result" class="card" aria-live="polite" hidden>
    <div class="sides">
      <div class="side" id="side1"><span class="name"></span><span class="pct"></span></div>
      <div class="side" id="side2"><span class="name"></span><span class="pct"></span></div>
    </div>
    <div class="bar"><div id="bar1"></div><div id="bar2"></div></div>
    <p id="summary"></p>
    <p id="context"></p>
  </section>

  <footer>
    <p id="model-info"></p>
    <p>CS2 yüksek varyanslı bir oyun; tahminleri kesin sonuç değil, olasılık olarak yorumla.</p>
    <p><a href="docs">API dokümantasyonu</a> · <a href="https://github.com/Daisyhaxx/fragpredict-engine" target="_blank" rel="noopener">GitHub</a></p>
  </footer>
</main>
<datalist id="team-list"></datalist>

<script>
  const $ = (id) => document.getElementById(id);
  const pct = new Intl.NumberFormat("tr-TR", { style: "percent", maximumFractionDigits: 1 });
  const num = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 3 });
  const fmtDate = (iso) =>
    new Date(iso).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });

  let knownTeams = new Set();

  async function getJSON(url, options) {
    const res = await fetch(url, options);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      // FastAPI: 400/500 -> detail string, 422 -> detail listesi
      const detail = Array.isArray(body.detail) ? body.detail.map((d) => d.msg).join(", ") : body.detail;
      throw new Error(detail || `Sunucu hatası (${res.status})`);
    }
    return body;
  }

  function showError(message) {
    $("error").textContent = message;
    $("error").hidden = !message;
    // Hata varken önceki sonuç, formdaki takımlara ait değil -> gösterme
    if (message) $("result").hidden = true;
  }

  async function init() {
    try {
      const [teams, maps, info] = await Promise.all([
        getJSON("api/v1/teams"),
        getJSON("api/v1/maps"),
        getJSON("api/v1/model"),
      ]);

      knownTeams = new Set(teams.teams);
      const list = $("team-list");
      for (const name of teams.teams) {
        const opt = document.createElement("option");
        opt.value = name;
        list.appendChild(opt);
      }

      const select = $("map");
      for (const name of maps.maps) {
        const opt = document.createElement("option");
        opt.value = opt.textContent = name;
        select.appendChild(opt);
      }
      $("pool-hint").textContent =
        `${teams.count} takım · Aktif harita havuzu ${fmtDate(maps.as_of)} itibarıyla son 60 günde oynanan haritalar.`;

      const m = info.test_metrics;
      $("model-info").textContent =
        `Model: ${info.model} · Veri: ${fmtDate(info.data_from)} – ${fmtDate(info.data_to)} · ` +
        `Görülmemiş test döneminde (${fmtDate(info.test_from)} – ${fmtDate(info.test_to)}) ` +
        `doğruluk ${pct.format(m["accuracy_at_0.5"])}, ROC-AUC ${num.format(m.roc_auc)}.`;

      $("submit").disabled = false;
      $("submit").textContent = "Tahmin et";
    } catch (err) {
      $("submit").textContent = "Yüklenemedi";
      showError(`Veriler yüklenemedi: ${err.message}. Sayfayı yenilemeyi dene.`);
    }
  }

  function renderResult(r) {
    $("side1").querySelector(".name").textContent = r.team1;
    $("side2").querySelector(".name").textContent = r.team2;
    $("side1").querySelector(".pct").textContent = pct.format(r.team1_win_probability);
    $("side2").querySelector(".pct").textContent = pct.format(r.team2_win_probability);
    $("bar1").style.width = `${r.team1_win_probability * 100}%`;
    $("bar2").style.width = `${r.team2_win_probability * 100}%`;

    const top = Math.max(r.team1_win_probability, r.team2_win_probability);
    $("summary").textContent = top < 0.55
      ? "Başa baş: model iki takımı neredeyse eşit görüyor."
      : `Favori: ${r.predicted_winner}`;
    $("context").textContent = r.map;
    $("result").hidden = false;
  }

  $("swap").addEventListener("click", () => {
    [$("team1").value, $("team2").value] = [$("team2").value, $("team1").value];
  });

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    showError("");

    const team1 = $("team1").value.trim();
    const team2 = $("team2").value.trim();
    const unknown = [team1, team2].filter((t) => !knownTeams.has(t));
    if (!team1 || !team2) return showError("İki takımı da seç.");
    if (unknown.length) return showError(`Listede olmayan takım: ${unknown.join(", ")}. Yazmaya başlayıp listeden seç.`);
    if (team1 === team2) return showError("Aynı takımı iki kez seçemezsin.");

    const button = $("submit");
    button.disabled = true;
    button.textContent = "Hesaplanıyor…";
    try {
      const result = await getJSON("api/v1/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          team1,
          team2,
          // tier/best_of gönderilmiyor: şampiyon model (Logistic Regression) bunları
          // kullanmıyor, tahmini değiştirmiyorlar -- API varsayılanları geçerli.
          map: $("map").value,
        }),
      });
      renderResult(result);
    } catch (err) {
      showError(err.message);
    } finally {
      button.disabled = false;
      button.textContent = "Tahmin et";
    }
  });

  init();
</script>
</body>
</html>
